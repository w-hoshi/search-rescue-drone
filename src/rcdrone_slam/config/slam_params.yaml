slam_toolbox:
  ros__parameters:

    # Solver
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # Frames
    odom_frame:  odom
    map_frame:   map
    base_frame:  base_footprint
    scan_topic:  /scan

    # ROS params
    use_sim_time:    false
    use_map_saver:   true
    mode:            mapping

    # Tuned for slow manual building flight
    debug_logging:              false  # true if debugging
    throttle_scans:             1      # every scan (was 2)
    map_update_interval:        0.5    # faster (was 2.0)
    transform_publish_period:   0.02
    minimum_time_interval:      0.14   # kept from original
    tf_buffer_duration:         60.0   # restored to original
    transform_timeout:          5.0
    stack_size_to_use:          40000000
    enable_interactive_mode:    true
    message_filter_queue_size:  20

    # Map quality
    resolution:                 0.05
    max_laser_range:            12.0

    # Travel thresholds
    # lowered: rf2o gives good odom, catch small movements
    minimum_travel_distance:    0.02   # was 0.2
    minimum_travel_heading:     0.02   # was 0.2

    # Scan matching
    # trust scan matching strongly (feature-rich building)
    use_scan_matching:          true
    use_scan_barycenter:        true
    distance_variance_penalty:  0.2    # was 0.5
    angle_variance_penalty:     0.2    # was 1.0

    # Search params
    fine_search_angle_offset:          0.00349
    coarse_search_angle_offset:        0.349
    coarse_angle_resolution:           0.0349
    minimum_angle_penalty:             0.9
    minimum_distance_penalty:          0.5
    use_response_expansion:            true

    # Correlation
    correlation_search_space_dimension:       0.5
    correlation_search_space_resolution:      0.01
    correlation_search_space_smear_deviation: 0.1

    # Loop closure
    # more aggressive: building has revisited areas
    do_loop_closing:                    true
    loop_search_maximum_distance:       10.0   # was 5.0
    loop_match_minimum_chain_size:      5      # was 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.3    # was 0.35
    loop_match_minimum_response_fine:   0.4    # was 0.45

    # Scan buffer
    scan_buffer_size:                   30     # was 20
    scan_buffer_maximum_scan_distance:  12.0   # was 10.0
    link_match_minimum_response_fine:   0.1
    link_scan_maximum_distance:         1.5

    # Loop closure search space
    loop_search_space_dimension:        8.0
    loop_search_space_resolution:       0.05
    loop_search_space_smear_deviation:  0.03

    # Map filtering
    min_pass_through:                   2
    occupancy_threshold:                0.1
